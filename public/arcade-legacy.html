<!DOCTYPE html>
<html lang="en">
<head>

<title>ICT Arcade | Learn and Play</title>
<style>
:root{--bg:#f4f6fd;--card:#fff;--ink:#1b1f3b;--mut:#5b6185;--acc:#2f5bff;--ok:#0f9d6e;--bad:#e5484d;--yel:#ffc93c;--line:#d9ddf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#12142a;--card:#1d2040;--ink:#eef0ff;--mut:#a3a9d6;--acc:#6d8cff;--ok:#38d39f;--bad:#ff6b70;--line:#343863}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

header b{font-size:1.2rem;letter-spacing:.3px;cursor:pointer}
#sc{background:var(--yel);color:#1b1f3b;font-weight:700;padding:4px 14px;border-radius:99px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:22px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0 .6em}h2{font-size:1.3rem;margin:.4em 0 .9em;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 15px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:18px;font:inherit;cursor:pointer}
.card span{font-size:2rem}.card b{font-size:1.15rem}.card small{color:var(--mut)}
.card:hover,.chip:hover,.opt:hover{border-color:var(--acc)}
.meta{color:var(--mut);margin-bottom:6px}
.opt,.m{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 10px;font:inherit;cursor:pointer}
.opt.ok,.m.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad,.m.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.m.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}
.m[disabled]{opacity:.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;margin:4px 8px 4px 0}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{flex:1;min-width:120px;margin:0}
.item{font-size:1.6rem;font-weight:700;text-align:center;background:var(--card);border:2px dashed var(--acc);border-radius:18px;padding:34px 16px;margin:12px 0 18px}
.big{font-size:3rem;font-weight:700;margin:.2em 0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
#fb{min-height:1.5em;font-weight:700}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.stage{position:relative;max-width:640px;margin:0 auto}
#cv{width:100%;height:auto;display:block;border-radius:14px;border:3px solid var(--ink);background:#7fd1ff;image-rendering:pixelated;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,30,.85);border-radius:12px;padding:12px;overflow:auto}
#ov[hidden]{display:none}
#ov .box{width:100%;max-width:520px}#ov h2{color:#eef0ff;font-size:1.05rem}
.pad{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:14px auto 0;touch-action:none;user-select:none}
.pad button{width:56px;height:56px;margin:3px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.2rem;touch-action:none}
.pad .act{width:76px;height:76px;background:var(--acc);color:#fff;font-weight:700}
.how{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 22px 10px;margin-bottom:18px}
.how h2{font-size:1.05rem;margin:.9em 0 .3em;color:var(--acc)}.how ul{margin:0;padding-left:1.2em}.how li{margin:.2em 0}
header{flex-wrap:wrap}#who{padding:4px 12px;font-size:.9rem}
.dg{max-width:640px;margin:10px auto 0}.dg h3{margin:.7em 0 .2em;font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.dv{display:inline-block;margin:3px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}.dv:hover{border-color:var(--acc)}.dv.ok{background:var(--ok);border-color:var(--ok);color:#fff}.dv.bad{background:var(--bad);border-color:var(--bad);color:#fff}

.lb{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}.lb td,.lb th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:520px){.two{gap:8px}.m{padding:10px;font-size:.9rem}}

 const after=()=>{if(Math.random()<Math.min(.55,.2+lv()*.05))addQ(1);check()};
 const pick=()=>{if(!q.length)addQ(1);front=q.shift();if(!deck.length)deck=sh(SC);front.p=deck.pop();front.tx=330;ph='walk';mood=0;tmax=Math.max(5.5,18-(lv()-1)*1.5);bs.forEach(x=>x.classList.remove('ok','bad'))};

  const dg=q.length>=4;c.fillStyle=dg&&Math.floor(TM()*3)%2?'#ff6b70':'#7a4e25';c.fillRect(0,40,58,175);c.fillStyle='#9fd3ff';c.fillRect(6,50,46,160);txt(c,'DOOR',10,70,11,'#1b1f3b');

/* ===== Snake ===== */
function snake(){
 const c=stage(),id=gid;let hp=3,sc=0,t=0,s,d,nd,f,over=0;
 const food=()=>{do f=[1+Math.floor(Math.random()*30),1+Math.floor(Math.random()*16)];while(s.some(q=>q[0]==f[0]&&q[1]==f[1]))};
 const spawn=()=>{s=[[16,9],[15,9],[14,9]];d=nd=[1,0];food()};
 const fin=()=>{if(hp<=0&&!over){over=1;done("Game over",`${sc} apples`,"Every correct answer grew your snake. Replay to beat it.",snake);return 1}};
 spawn();
 const loop=()=>{if(id!=gid)return;
  if(!busy&&!over){
   if(K.l&&d[0]!=1)nd=[-1,0];if(K.r&&d[0]!=-1)nd=[1,0];if(K.u&&d[1]!=1)nd=[0,-1];if(K.d&&d[1]!=-1)nd=[0,1];
   if(++t%Math.max(3,7-Math.floor(sc/4))==0){d=nd;const h=[s[0][0]+d[0],s[0][1]+d[1]];
    if(h[0]<0||h[0]>31||h[1]<0||h[1]>17||s.some(q=>q[0]==h[0]&&q[1]==h[1])){hp--;if(!fin())spawn()}
    else{s.unshift(h);if(h[0]==f[0]&&h[1]==f[1])ask(r=>{if(r)sc++;else{s.pop();hp--;fin()}food()});else s.pop()}}
  }
  c.fillStyle="#12142a";c.fillRect(0,0,640,360);
  dSnake(c,s,f,d,hp,sc);requestAnimationFrame(loop);return;s.forEach((q,i)=>{c.fillStyle=i?"#12b886":"#5ad17a";c.fillRect(q[0]*20+1,q[1]*20+1,18,18)});
  c.fillStyle="#e5484d";c.fillRect(f[0]*20+1,f[1]*20+1,18,18);c.fillStyle="#fff";c.font="bold 14px sans-serif";c.fillText("?",f[0]*20+6,f[1]*20+15);
  c.font="bold 16px sans-serif";c.fillText("❤".repeat(Math.max(hp,0))+"   Apples "+sc,12,20);
  requestAnimationFrame(loop)};loop()}
/* ===== Taxi Rush ===== */
function taxi(){
 const c=stage(),id=gid,X=[213,320,427];let hp=3,fares=0,lane=1,px=320,lc=0,inv=0,t=0,off=0,over=0,obj=[];
 const fin=()=>{if(hp<=0&&!over){over=1;done("Shift over",`${fares} fares`,"Each correct answer earned a fare. Replay to beat your shift.",taxi)}};
 const loop=()=>{if(id!=gid)return;
  if(!busy&&!over){
   const v=3+Math.min(fares,20)*.25;t++;off=(off+v)%40;
   if(lc>0)lc--;else if(K.l&&lane>0){lane--;lc=12}else if(K.r&&lane<2){lane++;lc=12}
   px+=(X[lane]-px)*.25;
   if(t%Math.max(25,60-fares*2)==0)obj.push({l:Math.floor(Math.random()*3),y:-70,p:Math.random()<.35});
   obj.forEach(o=>o.y+=v);obj=obj.filter(o=>o.y<380&&!o.x);
   for(const o of obj){if(o.p?hitbox(px-20,290,40,64,X[o.l]-12,o.y,24,34):hitbox(px-20,290,40,64,X[o.l]-20,o.y,40,64)){
    o.x=1;if(o.p)ask(r=>{if(r)fares++;else{hp--;fin()}});else if(inv<=0){hp--;inv=80;fin()}}}
   if(inv>0)inv--;
  }
  dTaxi(c,obj,px,inv,off,hp,fares);requestAnimationFrame(loop);return;c.fillStyle="#3a9d4f";c.fillRect(0,0,640,360);c.fillStyle="#3b3f66";c.fillRect(160,0,320,360);
  c.fillStyle="#fff";c.fillRect(160,0,4,360);c.fillRect(476,0,4,360);for(let y=-40+off;y<360;y+=40){c.fillRect(264,y,4,20);c.fillRect(372,y,4,20)}
  obj.forEach(o=>{if(o.p){c.fillStyle="#ffc93c";c.beginPath();c.arc(X[o.l],o.y+8,8,0,6.3);c.fill();c.fillStyle="#fff";c.fillRect(X[o.l]-7,o.y+16,14,18)}else{c.fillStyle=o.l==1?"#e5484d":"#8e5bff";c.fillRect(X[o.l]-20,o.y,40,64);c.fillStyle="#1b1f3b";c.fillRect(X[o.l]-15,o.y+40,30,12)}});
  if(inv%8<4){c.fillStyle="#ffc93c";c.fillRect(px-20,290,40,64);c.fillStyle="#1b1f3b";c.fillRect(px-14,305,28,14);c.fillRect(px-8,296,16,6)}
  c.fillStyle="#fff";c.font="bold 16px sans-serif";c.fillText("❤".repeat(Math.max(hp,0))+"   Fares "+fares,12,24);
  requestAnimationFrame(loop)};loop()}
/* ===== Wing Byte ===== */
function flap(){
 const c=stage(),id=gid;let hp=3,sc=0,y=180,by=180,vy=0,inv=0,pr=0,over=0,t=0,wait=1,pipes=[];
 const fl=()=>{if(!busy){if(wait)inv=60;wait=0;vy=-7.2}};c.canvas.onpointerdown=fl;
 const fin=()=>{if(hp<=0&&!over){over=1;done("Game over",`${sc} pipes`,"Replay to fly further.",flap)}};
 const loop=()=>{if(id!=gid)return;
  if(!busy&&!over){
   const k=K.a||K.u;if(k&&!pr)fl();pr=k;
   if(wait){y=by+Math.sin(TM()*4)*8;vy=0}else{vy+=.45;y+=vy;t++}
   if(!wait&&t%90==1)pipes.push({x:640,g:100+Math.random()*160,d:0});
   if(!wait)pipes.forEach(q=>q.x-=2.6);pipes=pipes.filter(q=>q.x>-60);
   pipes.forEach(q=>{if(!q.d&&q.x+50<88){q.d=1;sc++;add(1);if(sc%5==0)ask(r=>{if(!r){hp--;fin()}})}});
   const bad=y<0||y>360||pipes.some(q=>hitbox(88,y-12,24,24,q.x,0,50,q.g-65)||hitbox(88,y-12,24,24,q.x,q.g+65,50,360));
   if(bad&&inv<=0){hp--;inv=90;vy=0;const n=pipes.find(q=>q.x+50>88);by=n?n.g:180;y=by;wait=1;fin()}
   if(inv>0)inv--;
  }
  c.fillStyle="#7fd1ff";c.fillRect(0,0,640,360);
  dFlap(c,pipes,y,inv,hp,sc,vy);if(wait)txt(c,'Press space, up arrow or tap to flap',140,110,18,'#1b1f3b');requestAnimationFrame(loop);return;c.fillStyle="#3a9d4f";pipes.forEach(q=>{c.fillRect(q.x,0,50,q.g-65);c.fillRect(q.x-4,q.g-81,58,16);c.fillRect(q.x,q.g+65,50,360);c.fillRect(q.x-4,q.g+65,58,16)});
  if(inv%8<4){c.fillStyle="#ffc93c";c.fillRect(88,y-12,24,24);c.fillStyle="#fff";c.fillRect(100,y-8,8,8);c.fillStyle="#1b1f3b";c.fillRect(104,y-6,3,3);c.fillStyle="#ff8a3c";c.fillRect(112,y,8,6)}
  c.fillStyle="#1b1f3b";c.font="bold 16px sans-serif";c.fillText("❤".repeat(Math.max(hp,0))+"   Pipes "+sc,12,24);
  requestAnimationFrame(loop)};loop()}

function home(){
 view(`<h1>Pick a topic, then pick a game</h1><div class="chips">${[0,1,2,3,4].map(k=>`<button class="chip ${k==topic?"on":""}" data-t="${k}">${k?k+". "+T[k]:"All topics"}</button>`).join("")}</div><div class="grid">${G.map((g,i)=>`<button class="card" data-g="${i}"><span class="game-index">${String(i+1).padStart(2,"0")}</span><b>${g[1]}</b><small>${g[2]}</small></button>`).join("")}</div>`);
 app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{topic=+b.dataset.t;home()});
 app.querySelectorAll(".card").forEach(b=>b.onclick=()=>intro(+b.dataset.g));
}
function done(title,big,sub,again){
 view(`<h1>${title}</h1><div class="big">${big}</div><p>${sub}</p><button class="btn" id="a">Play again</button><button class="btn alt" id="h">Back to games</button>`);
 $("#a").onclick=again;$("#h").onclick=home;
}
function quiz(){
 const qs=Array.from({length:10},()=>{const x=mkQ();return[0,x.q,x.o]});let i=0,s=0,st=0;
 const next=()=>{
  if(i>=qs.length)return done("Quiz Blitz complete",`${s}/${qs.length}`,s>=8?"Brilliant. You are exam ready for this topic.":s>=5?"Good progress. Replay to lock it in.":"Keep going. Replay and watch for the answers you missed.",quiz);
  const q=qs[i];
  view(`<div class="meta">Question ${i+1} of ${qs.length} · Streak ${st}</div><h2>${q[1]}</h2>${sh(q[2]).map(t=>`<button class="opt">${t}</button>`).join("")}<div id="nx"></div>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const right=b.textContent==q[2][0];
   app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.textContent==q[2][0])o.classList.add("ok")});
   if(right){s++;st++;add(10+Math.min(st,5)*2)}else{st=0;b.classList.add("bad")}
   i++;$("#nx").innerHTML=`<button class="btn" id="n">${i>=qs.length?"See score":"Next question"}</button>`;$("#n").onclick=next;$("#n").focus();
  });
 };next();
}
function tf(){
 const q=Array.from({length:150},mkTF);let i=0,s=0,t=45;
 view(`<div class="meta">Score <span id="s">0</span> · <span id="t">45</span>s left</div><div class="bar"><i id="b" style="width:100%"></i></div><h2 id="q"></h2><div class="row"><button class="btn" id="y">True</button><button class="btn alt" id="n">False</button></div><p id="fb"></p>`);
 const show=()=>$("#q").textContent=q[i%q.length][1];show();
 const ans=v=>{const c=q[i%q.length][2]==v;if(c){s++;add(2)}$("#fb").textContent=c?"Correct":"Not quite";$("#fb").style.color=c?"var(--ok)":"var(--bad)";i++;$("#s").textContent=s;show()};
 $("#y").onclick=()=>ans(1);$("#n").onclick=()=>ans(0);
 timer=setInterval(()=>{t--;$("#t").textContent=t;$("#b").style.width=t/45*100+"%";if(t<=0)done("Time’s up",s,s>=12?"Lightning fast.":"Play again and beat your score.",tf)},1000);
}
function match(){
 const k=topic||1+Math.floor(Math.random()*4),p=sh(M[k]).slice(0,6);let sel=null,ok=0,mv=0;
 view(`<div class="meta">${T[k]} · tap a term, then its meaning</div><div class="two"><div>${sh(p).map(x=>`<button class="m" data-s="L" data-v="${x[0]}">${x[0]}</button>`).join("")}</div><div>${sh(p).map(x=>`<button class="m" data-s="R" data-v="${x[0]}">${x[1]}</button>`).join("")}</div></div>`);
 app.querySelectorAll(".m").forEach(b=>b.onclick=()=>{
  if(!sel){sel=b;b.classList.add("sel");return}
  if(sel.dataset.s==b.dataset.s){sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
  mv++;const a=sel;sel=null;a.classList.remove("sel");
  if(a.dataset.v==b.dataset.v){[a,b].forEach(x=>{x.classList.add("ok");x.disabled=true});ok++;add(5);if(ok==p.length)setTimeout(()=>done("All matched",`${mv} tries`,`${p.length} pairs. Fewer tries is a better score.`,match),600)}
  else{[a,b].forEach(x=>x.classList.add("bad"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("bad")),600)}
 });
}
function sort(){
 const set=pool(S)[0],it=sh(set.i);let i=0,s=0;
 const draw=()=>{
  if(i>=it.length)return done("Sorted",`${s}/${it.length}`,"Replay a different topic to see a new set.",sort);
  view(`<div class="meta">${set.title} · ${i+1} of ${it.length}</div><div class="item">${it[i][0]}</div><div class="row">${set.b.map((n,k)=>`<button class="btn" data-k="${k}">${n}</button>`).join("")}</div><p id="fb"></p>`);
  app.querySelectorAll(".btn").forEach(b=>b.onclick=()=>{
   const c=+b.dataset.k==it[i][1];app.querySelectorAll(".btn").forEach(x=>x.disabled=true);
   if(c){s++;add(3)}$("#fb").textContent=c?"Correct":"Incorrect: It belongs in: "+set.b[it[i][1]];$("#fb").style.color=c?"var(--ok)":"var(--bad)";
   i++;setTimeout(draw,c?600:1400);
  });
 };draw();
}
